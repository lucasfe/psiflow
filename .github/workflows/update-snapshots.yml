name: Update Visual Snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to update snapshots on
        required: true
        default: develop

jobs:
  update:
    name: Regenerate Linux baselines
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Generate snapshots
        run: pnpm test:e2e:update
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Commit updated baselines
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add e2e/snapshots/
          git diff --staged --quiet && echo "No snapshot changes." || \
            git commit -m "chore: update visual regression baselines (linux) [skip ci]" && git push
